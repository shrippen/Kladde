# CI: core tests, the app offscreen, the Health Connect probe as an APK.
#
# Private repo for now: the checks run on Gitea. When the repo goes public, this moves to
# .github/workflows (GitHub checks, reports back to Gitea; see /home/arian/Hacking/eigene/CLAUDE.md).
# Stays local: anything that needs Health Connect on a phone or a watch (the probe's run,
# the real sync).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core, kladde-push and the Kirigami app (Arch container: current Qt 6 and KF6).
  qt:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git nodejs base-devel cmake ninja qt6-base qt6-declarative qt6-svg kirigami
      - uses: actions/checkout@v4
      - name: Kante (public mirror)
        run: git clone --depth 1 https://github.com/shrippen/Kante.git ../Kante
      - name: Kante copy matches Kante main
        run: |
          tools/sync-kante.sh ../Kante
          git diff --exit-code -- app/qml
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: kladde-push on the fixture
        run: build/tools/kladde-push --dry-run --zone Europe/Berlin tests/fixtures/pebble-day.json > /dev/null
      - name: App starts and renders
        run: |
          timeout 60 build/app/kladde --shot /tmp/kladde.png 2>&1 | tee /tmp/kladde.log
          test -s /tmp/kladde.png
          ! grep -E 'qrc:.*(Error|Unable|is not)' /tmp/kladde.log

  # The phase 0 probe, a plain Kotlin app. The APK is a CI artifact for the phone, not a release.
  hc-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Build
        working-directory: spikes/hc-probe
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: hc-probe-debug-apk
          path: spikes/hc-probe/app/build/outputs/apk/debug/*.apk
