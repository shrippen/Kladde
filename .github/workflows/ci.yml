# Public mirror: Gitea pushes every branch and tag here on each commit.
# This runs the checks and reports them back to the commit on Gitea as
# the status "github / test", where the pull requests live. There are no
# pull requests on GitHub, so everything runs on push.
#
# Stays local (needs a phone or a watch): the probe's run against Health
# Connect, the real sync, the APK on a device.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the
# repository (commit statuses).
name: ci

on:
  push:
    branches: ["**"]

# No concurrency group: every commit runs to the end and keeps its own
# status, a newer push does not cancel an older run.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/Kladde/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # Core, kladde-push and the Kirigami app (Arch container: current Qt 6
  # and KF6, as on the development machine).
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - name: Tools
        run: pacman -Syu --noconfirm --needed git base-devel cmake ninja qt6-base qt6-declarative qt6-svg qt6-tools qtkeychain-qt6 kirigami python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Release headings "## [X.Y.Z] — YYYY-MM-DD": a wrong one shows up here, not at the tag.
      - name: Changelog
        run: scripts/release-notes.sh --check
      - name: Kante (public mirror)
        run: git clone --depth 1 https://github.com/shrippen/Kante.git ../Kante
      - name: Kante copy matches Kante main
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/sync-kante.sh ../Kante
          git diff --exit-code -- app/qml
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: kladde-push on the fixture
        run: build/tools/kladde-push --dry-run --zone Europe/Berlin tests/fixtures/pebble-day.json > /dev/null
      - name: App starts and renders
        run: |
          timeout 60 build/app/kladde --shot /tmp/kladde.png 2>&1 | tee /tmp/kladde.log
          test -s /tmp/kladde.png
          ! grep -E 'qrc:.*(Error|Unable|is not)' /tmp/kladde.log
      # The demo build (screenshots only, never shipped) still starts, signs in and draws
      # every tab from the Studio Weber world.
      - name: Demo screenshots
        run: |
          mkdir -p /tmp/shots
          SHOT_DIR=/tmp/shots SHOT_PLAN="$(python3 -c 'import json; print(json.dumps(json.load(open("demo/shots.json"))["shots"]))')" \
            KLADDE_DEMO_BUILD=build-demo DEMO_TODAY=2026-11-04 QT_QPA_PLATFORM=offscreen timeout 300 demo/start.sh de 2>&1 | tee /tmp/demo.log
          for s in home history log more; do test -s /tmp/shots/$s.png; done
          ! grep -E 'qrc:.*(Error|Unable|is not)' /tmp/demo.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-shots
          path: /tmp/shots/*.png
      # Reports, does not block: the Arch container brings new Qt versions without notice.
      - name: qmllint
        continue-on-error: true
        run: tools/qmllint.sh

  # The Android sync's unit tests (JVM, shared fixtures with core) and the
  # phase 0 probe. The probe APK is a CI artifact for the phone, not a release.
  hc-probe:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      # No setup-android: ubuntu-latest has the Android SDK (ANDROID_HOME); the action's
      # "sdkmanager tools" fails with the image's cmdline-tools 16.
      - name: Sync tests
        working-directory: android
        run: ./gradlew --no-daemon :sync:testDebugUnitTest :sync:assembleDebug
      - name: Build the probe
        working-directory: spikes/hc-probe
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hc-probe-debug-apk
          path: spikes/hc-probe/app/build/outputs/apk/debug/*.apk

  # The app for Android: the debug APK (de.arianw.kladde.dev, "Kladde Dev", installs next
  # to a release) as an artifact of every push, for trying a branch on the phone. Built by
  # the same script as on a developer machine; Qt and the dependencies (Kirigami,
  # QtKeychain, OpenSSL) come from the cache while the scripts stay the same.
  android:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      # Qt's host tools (qsb for Kirigami's shaders) need the GL libraries of a desktop.
      - name: Host libraries for Qt tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 > /dev/null
      - name: Android SDK packages
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Qt
            ~/kf6-android
          key: android-deps-${{ hashFiles('scripts/build-android.sh', 'scripts/build-deps-android.sh') }}
      - name: Build the APK
        env:
          KLADDE_VERBOSE: 1
        run: scripts/build-android.sh debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kladde-debug-apk
          path: dist/android/kladde-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Also runs when a check failed or was cancelled, so Gitea never keeps a
  # stale "pending".
  report:
    needs: [test, hc-probe, android]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          if [ "$TEST" = success ] && [ "$PROBE" = success ] && [ "$APK" = success ]; then
            state=success; result=success
          elif [ "$TEST" = failure ] || [ "$PROBE" = failure ] || [ "$APK" = failure ]; then
            state=failure; result=failure
          else
            state=error; result="test $TEST, hc-probe $PROBE, android $APK"
          fi
          desc=$result
          if [ -n "$STARTED" ]; then desc="$result in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          TEST: ${{ needs.test.result }}
          PROBE: ${{ needs.hc-probe.result }}
          APK: ${{ needs.android.result }}
          STARTED: ${{ needs.test.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
